      (d.roteiros || []).forEach((rot) => (rot.secoes || []).forEach((sec) => (sec.itens || []).forEach((it) => {
        const ch = it.chamado || {};
        const r = Object.assign({}, VAZIO, {
          status: rev[it.status] || "nao",
          obs: it.observacoes || "", problema: it.problemas || "",
          evidencia: it.evidencias || "", sugestao: it.sugestao || "",
          chamado: ch.necessario ? 1 : 0, cTitulo: ch.titulo || "", cDesc: ch.descricao || "",
          cSev: revSev[ch.severidade] || "media", cImpacto: ch.impacto || "",
          cPrio: ch.prioridade || "Média", cNum: ch.numero || ""
        });
        if (r.status !== "nao" || temConteudo(r)) alvo.itens[rot.codigo + "." + it.codigo] = r;
      })));
      App.db.modulos[mod.id] = alvo;
      App.db.ui.modulo = mod.id;
      salvar(true);
      App.modulo = mod; App.view = "dashboard";
      App.roteiro = mod.roteiros[0].c;
      App.abertos = {};
      preencherMeta(); renderTudo();
      toast("Avaliação importada com sucesso.", "ok");
    });
}


/* =============================================================================
 * EXPORTAÇÃO PARA EXCEL (.xlsx) — gerador OOXML nativo, sem bibliotecas
 * -----------------------------------------------------------------------------
 * Monta um arquivo .xlsx de verdade (pacote ZIP com XML no formato
 * SpreadsheetML) diretamente no navegador. Sem CDN, sem dependências.
 *
 *   1. CRC32 + escritor de ZIP (método STORE, sem compressão)
 *   2. Paleta e catálogo de estilos (styles.xml)
 *   3. Construtor de planilhas
 *   4. Montagem do documento didático
 *
 * Diretrizes de design aplicadas (das skills de UI/UX da equipe):
 *   · paleta semântica derivada da marca, nunca cores cruas espalhadas;
 *   · cor jamais carrega significado sozinha — todo status traz o rótulo escrito;
 *   · contraste mínimo AA (4,5:1) entre texto e preenchimento;
 *   · números em colunas tabulares, alinhados à direita;
 *   · legenda sempre visível, na primeira aba;
 *   · estado vazio explicativo em vez de aba em branco.
 * ========================================================================== */

/* ------------------------------------------------------ 1. ZIP (store) */

const CRC_TAB = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TAB[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const UTF8 = new TextEncoder();

/** Empacota [{nome, dados:Uint8Array}] num ZIP sem compressão. */
function zipStore(arquivos) {
  const agora = new Date();
  const horaDOS = ((agora.getHours() << 11) | (agora.getMinutes() << 5) | (agora.getSeconds() / 2)) & 0xFFFF;
  const dataDOS = (((agora.getFullYear() - 1980) << 9) | ((agora.getMonth() + 1) << 5) | agora.getDate()) & 0xFFFF;

  const locais = [], centrais = [];
  let offset = 0;

  arquivos.forEach((f) => {
    const nome = UTF8.encode(f.nome);
    const dados = f.dados;
    const crc = crc32(dados);

    const lh = new Uint8Array(30 + nome.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);      // assinatura
    lv.setUint16(4, 20, true);              // versão necessária
    lv.setUint16(6, 0x0800, true);          // flag: nomes em UTF-8
    lv.setUint16(8, 0, true);               // método: store
    lv.setUint16(10, horaDOS, true);
    lv.setUint16(12, dataDOS, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, dados.length, true);   // tamanho comprimido
    lv.setUint32(22, dados.length, true);   // tamanho original
    lv.setUint16(26, nome.length, true);
    lv.setUint16(28, 0, true);              // extra
    lh.set(nome, 30);

    const ch = new Uint8Array(46 + nome.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, horaDOS, true);
    cv.setUint16(14, dataDOS, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dados.length, true);
    cv.setUint32(24, dados.length, true);
    cv.setUint16(28, nome.length, true);
    cv.setUint32(42, offset, true);         // deslocamento do cabeçalho local
    ch.set(nome, 46);

    locais.push(lh, dados);
    centrais.push(ch);
    offset += lh.length + dados.length;
  });

  const tamCentral = centrais.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, arquivos.length, true);
  ev.setUint16(10, arquivos.length, true);
  ev.setUint32(12, tamCentral, true);
  ev.setUint32(16, offset, true);

  const partes = locais.concat(centrais, [eocd]);
  const total = partes.reduce((a, b) => a + b.length, 0);
  const saida = new Uint8Array(total);
  let p = 0;
  partes.forEach((b) => { saida.set(b, p); p += b.length; });
  return saida;
}

    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="' + Object.keys(S).length + '">' + cellXfs + "</cellXfs>" +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    "</styleSheet>";
}

/* ------------------------------------------- 3. CONSTRUTOR DE PLANILHAS */

function colLetra(n) {
  let s = "";
  n++;
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/** Escapa e sanitiza texto para XML (remove controles ilegais). */
function xmlTxt(v) {
  return String(v == null ? "" : v)
    .replace(new RegExp("[\u0000-\u0008\u000B\u000C\u000E-\u001F]", "g"), "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/** Cria uma aba. Cada célula é {v, s, n:true|false} ou um atalho de string. */
function novaAba(nome, opcoes) {
  return {
    nome: nome.slice(0, 31).replace(/[\\\/\?\*\[\]:]/g, "-"),
    linhas: [], cols: (opcoes && opcoes.cols) || [], merges: [],
    congelar: (opcoes && opcoes.congelar) || 0,
    filtro: null,
    add(celulas, altura) { this.linhas.push({ c: celulas || [], h: altura || 0 }); return this.linhas.length; },
    vazia(n) { for (let i = 0; i < (n || 1); i++) this.linhas.push({ c: [], h: 0 }); },
    mesclar(l1, c1, l2, c2) { this.merges.push(colLetra(c1) + l1 + ":" + colLetra(c2) + l2); }
  };
}

function abaXML(aba) {
  const linhas = aba.linhas.map((linha, i) => {
    const r = i + 1;
    const cels = linha.c.map((cel, j) => {
      if (cel == null) return "";
      const est = (typeof cel === "object" && cel.s != null) ? cel.s : S.PADRAO;
      const val = (typeof cel === "object") ? cel.v : cel;
      const ref = colLetra(j) + r;
      if (val === "" || val == null) return '<c r="' + ref + '" s="' + est + '"/>';
      if (typeof cel === "object" && cel.n) {
        const num = typeof val === "number" && isFinite(val) ? val : 0;
        return '<c r="' + ref + '" s="' + est + '"><v>' + num + "</v></c>";
      }
      return '<c r="' + ref + '" s="' + est + '" t="inlineStr"><is><t xml:space="preserve">' +
             xmlTxt(val) + "</t></is></c>";
    }).join("");
    return '<row r="' + r + '"' + (linha.h ? ' ht="' + linha.h + '" customHeight="1"' : "") + ">" + cels + "</row>";
  }).join("");

  const cols = aba.cols.length
    ? "<cols>" + aba.cols.map((w, i) =>
        '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + "</cols>"
    : "";

  const pane = aba.congelar
    ? '<pane ySplit="' + aba.congelar + '" topLeftCell="A' + (aba.congelar + 1) +
      '" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/>'
    : "";

  const nLin = aba.linhas.length || 1;
  const nCol = Math.max(1, aba.cols.length || aba.linhas.reduce((m, l) => Math.max(m, l.c.length), 1));

  /* A ordem dos elementos é obrigatória no OOXML: autoFilter vem antes de mergeCells. */
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<dimension ref="A1:' + colLetra(nCol - 1) + nLin + '"/>' +
    '<sheetViews><sheetView showGridLines="0" workbookViewId="0">' + pane + "</sheetView></sheetViews>" +
    '<sheetFormatPr defaultRowHeight="15"/>' + cols +
    "<sheetData>" + linhas + "</sheetData>" +
    (aba.filtro ? '<autoFilter ref="' + aba.filtro + '"/>' : "") +
    (aba.merges.length ? '<mergeCells count="' + aba.merges.length + '">' +
      aba.merges.map((m) => '<mergeCell ref="' + m + '"/>').join("") + "</mergeCells>" : "") +
    '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>' +
    '<pageSetup orientation="landscape" fitToWidth="1" paperSize="9"/>' +
    "</worksheet>";
}

/** Empacota as abas num .xlsx completo. */
function montarXLSX(abas, titulo) {
  const arquivos = [];
  const put = (nome, txt) => arquivos.push({ nome: nome, dados: UTF8.encode(txt) });

  put("[Content_Types].xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    abas.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
      '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
    "</Types>");

  put("_rels/.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
    "</Relationships>");

  put("xl/workbook.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    "<sheets>" + abas.map((a, i) =>
      '<sheet name="' + xmlTxt(a.nome) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("") +
    "</sheets></workbook>");

  put("xl/_rels/workbook.xml.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    abas.map((_, i) => '<Relationship Id="rId' + (i + 1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
      (i + 1) + '.xml"/>').join("") +
    '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    "</Relationships>");

  put("xl/styles.xml", stylesXML());
  abas.forEach((a, i) => put("xl/worksheets/sheet" + (i + 1) + ".xml", abaXML(a)));

  put("docProps/core.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
    "<dc:title>" + xmlTxt(titulo) + "</dc:title>" +
    "<dc:creator>Faktory Flow · Plataforma de Validação</dc:creator>" +
    "<cp:lastModifiedBy>Faktory Flow</cp:lastModifiedBy>" +
    '<dcterms:created xsi:type="dcterms:W3CDTF">' + new Date().toISOString() + "</dcterms:created>" +
    "</cp:coreProperties>");

  put("docProps/app.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" ' +
    'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
    "<Application>Faktory Flow</Application><Company>Faktory Flow</Company></Properties>");

  return zipStore(arquivos);
}


/* ------------------------------------ 4. MONTAGEM DO DOCUMENTO DIDÁTICO */

/* Atalhos de célula: texto, número e percentual. */
const T = (v, s) => ({ v: v, s: s == null ? S.CEL : s });
const N = (v, s) => ({ v: v, s: s == null ? S.NUM : s, n: true });
const P = (v, s) => ({ v: v, s: s == null ? S.PCT : s, n: true });

const EST_STATUS = { aprovado: S.APR, reprovado: S.REP, bloqueado: S.BLO, andamento: S.AND, nao: S.NAO };
const EST_SEV = { baixa: S.SEV_BAIXA, media: S.SEV_MEDIA, alta: S.SEV_ALTA, critica: S.SEV_CRIT };

/** Mini-barra textual de progresso — legível no Excel sem formatação condicional. */
function barra(p) {
  const cheio = Math.round((Math.max(0, Math.min(100, p)) / 100) * 10);
  return "█".repeat(cheio) + "░".repeat(10 - cheio);
}

/** Cabeçalho padrão de aba: título, explicação e linha de respiro. */
function cabecalhoAba(aba, titulo, explicacao, larguraMerge) {
  aba.add([T(titulo, S.TIT_ABA)], 26);
  aba.mesclar(1, 0, 1, larguraMerge - 1);
  aba.add([T(explicacao, S.LEGENDA)], 30);
  aba.mesclar(2, 0, 2, larguraMerge - 1);
  aba.vazia(1);
}

/** Linha de cabeçalho de tabela + registro do autofiltro. */
function cabecalhoTabela(aba, colunas) {
  const linha = aba.add(colunas.map((c) => T(c, S.CAB)), 30);
  return linha;
}

/* ---------------------------------------------------------- ABA: CAPA */

function abaCapa(mod, meta, s, v) {
  const L = 6;
  const aba = novaAba("Capa", { cols: [26, 22, 20, 20, 20, 22] });

  /* Faixa de marca */
  aba.add([T("FAKTORY FLOW", S.CAPA_TIT)], 34);
  aba.mesclar(1, 0, 1, L - 1);
  aba.add([T("Relatório de Validação · Módulo " + mod.nome, S.CAPA_SUB)], 22);
  aba.mesclar(2, 0, 2, L - 1);
  aba.add([T("", S.FAIXA_LIME)], 6);
  aba.mesclar(3, 0, 3, L - 1);
  aba.vazia(1);

  /* Identificação */
  aba.add([T("Identificação da validação", S.SECAO)], 22);
  aba.mesclar(5, 0, 5, L - 1);
  const ident = [
    ["Módulo", mod.nome], ["Documento de origem", mod.versaoDoc],
    ["Responsável", meta.responsavel || "— não informado —"],
    ["Data da validação", dataBR(meta.data)],
    ["Ambiente testado", ambienteLabel(meta)],
    ["Versão / build testada", meta.versao || "— não informada —"],
    ["Relatório gerado em", agoraBR()]
  ];
  ident.forEach((par) => aba.add([T(par[0], S.ROTULO), T(par[1], S.VALOR)], 17));
  aba.vazia(1);

  /* Parecer final */
  const estParecer = { apr: S.APR, res: S.AND, rep: S.REP, na: S.NAO }[v.k];
  aba.add([T("Parecer final", S.SECAO)], 22);
  aba.mesclar(aba.linhas.length, 0, aba.linhas.length, L - 1);
  const lp = aba.add([T(v.titulo + (v.preliminar ? "  (preliminar)" : ""), estParecer)], 30);
  aba.mesclar(lp, 0, lp, L - 1);
  const lj = aba.add([T(v.texto, S.LEGENDA)], 46);
  aba.mesclar(lj, 0, lj, L - 1);
  aba.vazia(1);

  /* Números de uma olhada */
  aba.add([T("Números de uma olhada", S.SECAO)], 22);
  aba.mesclar(aba.linhas.length, 0, aba.linhas.length, L - 1);
  aba.add([T("Etapas previstas", S.KPI_ROT), T("Executadas", S.KPI_ROT), T("Aprovadas", S.KPI_ROT),
           T("Reprovadas", S.KPI_ROT), T("Bloqueadas", S.KPI_ROT), T("Chamados", S.KPI_ROT)], 16);
  aba.add([N(s.total, S.KPI_VAL), N(s.executados, S.KPI_VAL), N(s.aprovado, S.KPI_VAL),
           N(s.reprovado, S.KPI_VAL), N(s.bloqueado, S.KPI_VAL), N(s.chamados, S.KPI_VAL)], 30);
  aba.add([T("Concluído", S.KPI_ROT), T("Taxa de aprovação", S.KPI_ROT), T("Pendentes", S.KPI_ROT),
           T("Fluxos críticos", S.KPI_ROT), T("Críticos aprovados", S.KPI_ROT), T("Roteiros", S.KPI_ROT)], 16);
  aba.add([P(s.pctConcluido / 100, S.KPI_VAL), P(s.pctAprovacao / 100, S.KPI_VAL), N(s.pendentes, S.KPI_VAL),
           N(s.criticosTotal, S.KPI_VAL), N(s.criticosAprovados, S.KPI_VAL), N(mod.roteiros.length, S.KPI_VAL)], 30);
  aba.vazia(1);

  /* Guia de uso */
  aba.add([T("Como usar esta planilha", S.SECAO)], 22);
  aba.mesclar(aba.linhas.length, 0, aba.linhas.length, L - 1);
  const guia = [
    ["Resumo", "Progresso de cada roteiro, com barra visual e totais. Comece por aqui para ver onde a validação está."],
    ["Chamados", "Todos os defeitos que exigem abertura de chamado, ordenados por severidade. É a lista de trabalho do time de desenvolvimento."],
    ["Etapas", "As " + s.total + " etapas do plano, uma por linha, com status e tudo que foi registrado. Use o filtro do cabeçalho para recortar."],
    ["Observações", "Só as etapas que receberam texto — observações, problemas, evidências e sugestões."]
  ];
  if (s.achados) guia.splice(3, 0, ["Achados", "Apontamentos que já vinham registrados no documento de origem, cruzados com a situação atual."]);
  guia.forEach((g, i) => {
    const est = i % 2 ? S.CEL_ALT : S.CEL, estT = i % 2 ? S.CEL_TXT_ALT : S.CEL_TXT;
    const l = aba.add([T("Aba “" + g[0] + "”", est), T(g[1], estT)], 32);
    aba.mesclar(l, 1, l, L - 1);
  });
  aba.vazia(1);

  /* Legendas — cor nunca sozinha: o rótulo escrito acompanha sempre */
  aba.add([T("Legenda — status da etapa", S.SECAO)], 22);
  aba.mesclar(aba.linhas.length, 0, aba.linhas.length, L - 1);
  const explicaStatus = {
    aprovado: "Executada e funcionou como o plano esperava.",
    reprovado: "Executada e o resultado divergiu do esperado.",
    bloqueado: "Não foi possível executar — dependência, permissão ou ambiente.",
    andamento: "Execução iniciada, ainda sem conclusão.",
    nao: "Ainda não executada."
  };
  ORDEM_STATUS.forEach((k, i) => {

/* ------------------------------------------------------- ORQUESTRAÇÃO */

function exportarXLSX() {
  const mod = App.modulo;
  const meta = moduloState(mod.id).meta;
  const itens = todosItens();
  const s = stats(itens);
  const v = parecer(s);
  const cham = chamados();
  const obs = observacoes();

  const abas = [
    abaCapa(mod, meta, s, v),
    abaResumo(mod, s),
    abaChamados(cham),
    abaEtapas(mod, itens)
  ];
  if (s.achados) abas.push(abaAchados(itens, s));
  abas.push(abaObservacoes(obs));

  try {
    const bytes = montarXLSX(abas, "Validação " + mod.nome + " · Faktory Flow");
    const nome = "validacao-" + slug(mod.nome) + "-" + hoje() + ".xlsx";
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Planilha " + nome + " gerada — " + abas.length + " abas.", "ok");
  } catch (e) {
    toast("Não foi possível gerar a planilha: " + e.message, "err");
  }
}


/* =============================================================================
 * DOCUMENTO DE ABERTURA DE CHAMADOS
 * -----------------------------------------------------------------------------
 * Exporta SOMENTE as etapas marcadas como "necessita abertura de chamado",
 * num documento autônomo pensado para ser entregue ao time de desenvolvimento.
 * Dois formatos, mesmo conteúdo:
 *   · .xlsx — Instruções, Chamados (tabela filtrável), Fichas (uma por chamado)
 *             e Resumo (por severidade, prioridade e roteiro);
 *   · .html — uma ficha por página, pronta para imprimir, salvar em PDF ou enviar.
 * ========================================================================== */

/* ---------------------------------------- CONTEÚDO REAL DE UM CHAMADO */

/** Verdadeiro só quando há conteúdo de verdade.
 *  Campo vazio, nulo, em branco ou preenchido apenas com traços não conta —
 *  e o que não conta nunca chega ao documento exportado. */
function txtCheio(v) {
  if (v == null) return false;
  const t = String(v).trim();
  return t !== "" && !/^[—–\-–—.·:;]+$/.test(t);
}

/** Título do chamado: exclusivamente o que o validador escreveu no campo.
 *  Sem título escrito, resta a referência do item no plano — que é
 *  identificação real, não texto de enfeite. */
function tituloChamado(c) {
  const t = String(c.r.cTitulo || "").trim();
  return t || (c.item.rot.c + " §" + c.item.cod);
}

/** Descrição do defeito sem repetir o que já foi dito em "resultado obtido". */
function descricaoChamado(c) {
  const desc = String(c.r.cDesc || "").trim();
  const prob = String(c.r.problema || "").trim();
  return desc && desc !== prob ? desc : "";
}

/** Ambiente em texto livre; string vazia quando nada foi informado. */
function ambienteTexto(meta) {
  const a = ambientePorId(meta.ambienteTipo);
  const url = String(meta.ambienteUrl || "").trim();
  if (!a) return url;
  return a.nome + (url ? " · " + url : "");
}

/** Campos que compõem a ficha de um chamado, na ordem em que se preenche o
 *  sistema de chamados. Só entram os que têm conteúdo: nada de placeholders,
 *  traços ou linhas vazias no documento entregue ao time. */
function fichaChamado(c) {
  const sev = SEVERIDADES[c.r.cSev] || SEVERIDADES.media;
  const st  = STATUS[c.r.status] || STATUS.nao;
  const achado = c.item.achado;
  return [
    ["Título", tituloChamado(c)],
    ["Severidade", sev.lbl],
    ["Prioridade", c.r.cPrio],
    ["Nº no sistema de chamados", c.r.cNum],
    ["Módulo", App.modulo.nome],
    ["Origem no plano", c.item.rot.c + " — " + c.item.rot.n + " · " + c.item.sec.t + " · item " + c.item.cod],
    ["Fluxo crítico", c.item.critico ? "Sim — o plano manda parar e reportar imediatamente" : ""],
    ["Passos para reproduzir", c.item.acao],
    ["Resultado esperado", c.item.esperado],
    ["Resultado obtido", c.r.problema],
    ["Descrição do defeito", descricaoChamado(c)],
    ["Impacto na operação", c.r.cImpacto],
    ["Evidências", c.r.evidencia],
    ["Observações do validador", c.r.obs],
    ["Sugestão de melhoria", c.r.sugestao],
    ["Achado do documento de origem", achado ? achado.txt : ""],
    ["Status da etapa", st.lbl]
  ].filter((p) => txtCheio(p[1])).map((p) => [p[0], String(p[1]).trim()]);
}

/** A mesma ficha em texto puro, pronta para colar no sistema de chamados.
 *  Campos curtos ficam na mesma linha; textos longos ganham linha própria. */
function textoFicha(c) {
  return fichaChamado(c).map((p) => {
    const v = p[1];
    return (v.indexOf("\n") > -1 || v.length > 72) ? p[0] + ":\n" + v : p[0] + ": " + v;
  }).join("\n");
}

      (c.item.critico ? "   ·   ★ FLUXO CRÍTICO" : ""), S.FICHA_TIT)], 26);
    aba.mesclar(lt, 0, lt, 3);

    fichaChamado(c).forEach((par) => {
      const l = aba.add([T(par[0], S.FICHA_ROT), T(par[1], S.FICHA_VAL)], 0);
      aba.mesclar(l, 1, l, 3);
    });
    aba.vazia(2);
  });
  return aba;
}

/* ------------------------------------------------------- ABA: RESUMO */

function abaChamadosResumo(mod, cham, porSev) {
  const aba = novaAba("Resumo", { cols: [10, 40, 14, 14, 14, 14, 14, 14] });

  cabecalhoAba(aba, "Onde os defeitos se concentram",
    "Contagens para priorizar a fila. Um roteiro com muitos chamados de severidade alta costuma indicar " +
    "um problema estrutural, não defeitos isolados.", 8);

  /* Por severidade */
  aba.add([T("Por severidade", S.SECAO)], 22);
  aba.add([T("Severidade", S.CAB), T("Chamados", S.CAB), T("% do total", S.CAB), T("Distribuição", S.CAB)], 26);
  ["critica", "alta", "media", "baixa"].forEach((k) => {
    const q = porSev[k] || 0;
    aba.add([T(SEVERIDADES[k].lbl, EST_SEV[k]), N(q), P(pct(q, cham.length) / 100),
             T(barra(pct(q, cham.length)))], 18);
  });
  aba.add([T("TOTAL", S.TOTAL), N(cham.length, S.TOTAL_NUM), P(1, S.TOTAL_PCT), T("", S.TOTAL)], 20);
  aba.vazia(2);

  /* Por prioridade */
  aba.add([T("Por prioridade", S.SECAO)], 22);
  aba.add([T("Prioridade", S.CAB), T("Chamados", S.CAB), T("% do total", S.CAB), T("Distribuição", S.CAB)], 26);
  PRIORIDADES.forEach((p, i) => {
    const q = cham.filter((c) => (c.r.cPrio || "Média") === p).length;
    const est = i % 2 ? S.CEL_ALT : S.CEL;
    aba.add([T(p, est), N(q, i % 2 ? S.NUM_ALT : S.NUM), P(pct(q, cham.length) / 100, i % 2 ? S.PCT_ALT : S.PCT),
             T(barra(pct(q, cham.length)), est)], 18);
  });
  aba.vazia(2);

  /* Por roteiro — só os que têm chamado */
  aba.add([T("Por roteiro do plano", S.SECAO)], 22);
  aba.add([T("Cód.", S.CAB), T("Roteiro", S.CAB), T("Crítico", S.CAB), T("Chamados", S.CAB),
           T("Crítica", S.CAB), T("Alta", S.CAB), T("Média", S.CAB), T("Baixa", S.CAB)], 26);
  let i = 0;
  mod.roteiros.forEach((rot) => {
    const doRot = cham.filter((c) => c.item.rot === rot);
    if (!doRot.length) return;
    const alt = i++ % 2 === 1;
    const cel = alt ? S.CEL_ALT : S.CEL, num = alt ? S.NUM_ALT : S.NUM;
    const q = (k) => doRot.filter((c) => (c.r.cSev || "media") === k).length;
    aba.add([T(rot.c, cel), T(rot.n, cel), T(rot.star ? "★ sim" : "—", rot.star ? S.CRIT : cel),
             N(doRot.length, num), N(q("critica"), num), N(q("alta"), num),
             N(q("media"), num), N(q("baixa"), num)], 18);
  });
  if (!i) {
    const l = aba.add([T("Nenhum roteiro com chamado registrado.", S.VAZIO)], 26);
    aba.mesclar(l, 0, l, 7);
  }
  return aba;
}

/* --------------------------------------------- EXPORTAÇÃO: PLANILHA */

function exportarChamadosXLSX() {
  const cham = chamados();
  if (!cham.length) {
    return toast("Nenhuma etapa marcada como “necessita chamado” ainda.", "warn");
  }
  const mod = App.modulo;
  const meta = moduloState(mod.id).meta;
  const porSev = {};
  cham.forEach((c) => { const k = c.r.cSev || "media"; porSev[k] = (porSev[k] || 0) + 1; });

  const abas = [
    abaChamadosInstrucoes(mod, meta, cham, porSev),
    abaChamadosTabela(cham),
    abaChamadosFichas(cham),
    abaChamadosResumo(mod, cham, porSev)
  ];

  try {
    const bytes = montarXLSX(abas, "Chamados " + mod.nome + " · Faktory Flow");
    const nome = "chamados-" + slug(mod.nome) + "-" + hoje() + ".xlsx";
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(cham.length + " chamado(s) exportados em " + nome, "ok");
  } catch (e) {
    toast("Não foi possível gerar a planilha: " + e.message, "err");
  }
}

/** Escapa e transforma URLs em links clicáveis — vale ouro no campo Evidências. */
function escLinks(s) {
  return esc(s).replace(/https?:\/\/[^\s<>"']+/g, (u) =>
    '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>");
}

/** Blocos de texto da ficha, já sem os vazios. */
function blocosChamado(c) {
  const achado = c.item.achado;
  return [
    { rot: "Passos para reproduzir",     txt: c.item.acao,       ic: "list" },
    { rot: "Resultado esperado",         txt: c.item.esperado,   ic: "target", tom: "ok" },
    { rot: "Resultado obtido",           txt: c.r.problema,      ic: "alert",  tom: "erro" },
    { rot: "Descrição do defeito",       txt: descricaoChamado(c), ic: "file" },
    { rot: "Impacto na operação",        txt: c.r.cImpacto,      ic: "flag",   tom: "aviso" },
    { rot: "Evidências",                 txt: c.r.evidencia,     ic: "inbox" },
    { rot: "Observações do validador",   txt: c.r.obs,           ic: "info" },
    { rot: "Sugestão de melhoria",       txt: c.r.sugestao,      ic: "spark" },
    { rot: "Achado do documento de origem" + (achado && achado.data ? " · " + achado.data : ""),
      txt: achado ? achado.txt : "",                             ic: "shield" }
  ].filter((b) => txtCheio(b.txt));
}

/** Trilha de rastreabilidade: de onde veio o chamado até o estado atual.
 *  Cada etapa só entra se tiver informação — sem etapas fantasma. */
function trilhaChamado(c, meta) {
  const st = STATUS[c.r.status] || STATUS.nao;
  const exec = [meta.responsavel, meta.data ? dataBR(meta.data) : "", ambienteTexto(meta)]
    .filter(txtCheio).join(" · ");
  return [
    ["Plano de validação", App.modulo.nome + (txtCheio(App.modulo.versaoDoc) ? " · " + App.modulo.versaoDoc : "")],
    ["Roteiro " + c.item.rot.c, c.item.rot.n],
    ["Seção", c.item.sec.t],
    ["Item §" + c.item.cod, c.item.critico ? "Fluxo crítico — parar e reportar" : ""],
    ["Execução", exec],
    ["Resultado da etapa", st.lbl],
    ["Nº no sistema de chamados", c.r.cNum]
  ].filter((p) => txtCheio(p[1]));
}

    "}",

    "}",

    ".hero{color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:8px}",
    ".ch,.kpi,.tag,.campo,.barra span,.grupo-n{-webkit-print-color-adjust:exact;print-color-adjust:exact}",
    ".ch{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border-color:#cbd5e1;transform:none!important}",
    ".ch-b{grid-template-rows:1fr!important;opacity:1!important}",

    ".grupo-h{break-after:avoid;page-break-after:avoid}",
    ".ch-tog{cursor:default;padding-bottom:8px}",
    "a{color:#0f172a;text-decoration:none}",
    "}"
  ].join("\n");
}

    "var aberto=corpo.classList.toggle('is-menu');",
    "var b=sel('#menu');if(b)b.setAttribute('aria-expanded',aberto?'true':'false');",
    "if(aberto&&q)q.focus();}",

    /* ---- cópia ---- */
    "function sinalizar(msg){",
    "if(!aviso)return;aviso.textContent=msg;aviso.classList.add('is-on');",
    "window.clearTimeout(avisoT);avisoT=window.setTimeout(function(){aviso.classList.remove('is-on');},1900);}",
    "function marcarBotao(b){",
    "if(!b)return;var r=b.querySelector('.rot'),antes=r?r.textContent:'';",
    "b.classList.add('is-ok');if(r)r.textContent='Copiado';",
    "window.setTimeout(function(){b.classList.remove('is-ok');if(r)r.textContent=antes;},1900);}",
    "function reserva(txt){",
    "var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');",
    "ta.style.position='fixed';ta.style.top='-2000px';ta.style.opacity='0';",
    "document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);",
    "var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}",
    "ta.parentNode.removeChild(ta);return ok;}",
    "function copiar(txt,botao,msg){",
    "var feito=function(){marcarBotao(botao);sinalizar(msg);};",
    "if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){",
    "navigator.clipboard.writeText(txt).then(feito,function(){",
    "if(reserva(txt))feito();else sinalizar('Não foi possível copiar automaticamente');});",
    "}else{if(reserva(txt))feito();else sinalizar('Não foi possível copiar automaticamente');}}",

    /* ---- impressão: abre as fichas visíveis e devolve o estado depois ---- */
    "var antesImpressao=null;",
    "window.addEventListener('beforeprint',function(){",
    "antesImpressao=cards.map(function(a){return a.classList.contains('is-fechado');});",
    "cards.forEach(function(a){a.classList.remove('is-fechado');});});",
    "window.addEventListener('afterprint',function(){",
    "if(!antesImpressao)return;",
    "cards.forEach(function(a,i){a.classList.toggle('is-fechado',!!antesImpressao[i]);});",
    "antesImpressao=null;sincronizarBotaoTudo();});",

    /* ---- eventos ---- */
    "document.addEventListener('click',function(e){",
    "var alvo=e.target;",
    "var acha=function(s){return alvo.closest?alvo.closest(s):null;};",
    "var tog=acha('.ch-tog');",
    "if(tog){var art=tog.closest('.ch');abrir(art,tog.getAttribute('aria-expanded')!=='true');sincronizarBotaoTudo();return;}",
    "var navI=acha('.nav-i');",
    "if(navI){e.preventDefault();irPara(navI.getAttribute('data-alvo'));return;}",
    "var chip=acha('.chip');",
    "if(chip){",
    "var lig=chip.getAttribute('aria-pressed')!=='true';",
    "chip.setAttribute('aria-pressed',lig?'true':'false');",
    "if(chip.hasAttribute('data-crit'))soCrit=lig;else sevOn[chip.getAttribute('data-sev')]=lig;",
    "filtrar();return;}",
    "var cop=acha('[data-copiar]');",
    "if(cop){var n=cop.getAttribute('data-copiar');",
    "copiar(FICHAS[n]||'',cop,'Ficha do chamado '+n+' copiada');return;}",
    "var ato=acha('[data-act]');if(!ato)return;",
    "var a=ato.getAttribute('data-act');",
    "if(a==='tudo'){todasFichas(ato.getAttribute('aria-pressed')!=='true');}",
    "else if(a==='tema'){var novo=raiz.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(novo);guardar('ff.chamados.tema',novo);}",
    "else if(a==='imprimir'){window.print();}",
    "else if(a==='copiar-todos'){",
    "var vis=cards.filter(function(c){return !c.hidden;});",
    "var txt=vis.map(function(c){return FICHAS[c.getAttribute('data-n')]||'';}).join('\\n\\n————————————————\\n\\n');",
    "copiar(txt,ato,vis.length+' ficha(s) copiadas');}",
    "else if(a==='menu'){alternarMenu();}",
    "else if(a==='limpar'){limparFiltros();if(q)q.focus();}",
    "else if(a==='limpar-busca'){termo='';if(q){q.value='';q.focus();}filtrar();}",
    "else if(a==='fechar-menu'){fecharMenu();}",
    "});",

    "if(q){q.addEventListener('input',function(){",
    "termo=q.value.trim();",
    "window.clearTimeout(q._t);q._t=window.setTimeout(filtrar,140);});",
    "q.addEventListener('keydown',function(e){if(e.key==='Escape'&&q.value){q.value='';termo='';filtrar();}});}",

    "document.addEventListener('keydown',function(e){",
    "if(e.key==='Escape'&&corpo.classList.contains('is-menu')){fecharMenu();return;}",
    "if(e.defaultPrevented)return;",
    "var t=e.target,tag=t&&t.tagName;",
    "if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;",
    "if(e.key==='/'){e.preventDefault();if(q){q.focus();q.select();}}",
    "else if(e.key==='e'||e.key==='E'){todasFichas(true);}",
    "else if(e.key==='r'||e.key==='R'){todasFichas(false);}",
    "});",

    "filtrar();",
    "})();"
  ].join("\n");
}

/** Uma ficha de chamado em HTML. Só monta o que tem conteúdo. */
function fichaChamadoHTML(f, total, meta) {
  const c = f.c;
  const k = c.r.cSev || "media";
  const sev = SEVERIDADES[k] || SEVERIDADES.media;
  const st = STATUS[c.r.status] || STATUS.nao;
  const id = "ch" + f.i;
  const titulo = tituloChamado(c);

  /* Índice de busca já normalizado: o documento não precisa recalcular nada. */
  const busca = norm([titulo, c.item.acao, c.item.esperado, c.r.problema, c.r.cDesc, c.r.cImpacto,
    c.r.obs, c.r.sugestao, c.r.evidencia, c.r.cNum, c.r.cPrio, sev.lbl, st.lbl,
    c.item.rot.c, c.item.rot.n, c.item.sec.t, c.item.cod].join(" "));

  let h = '<article class="ch sev-' + k + '" id="' + id + '" data-sev="' + k + '" data-n="' + f.i + '"' +
          (c.item.critico ? ' data-crit="1"' : "") +
          ' data-busca="' + escAttr(busca) + '" tabindex="-1"' +
          ' style="--d:' + (Math.min(f.i, 12) * 35) + 'ms">';

  h += '<h3 class="ch-h">' +
       '<button type="button" class="ch-tog" aria-expanded="true" aria-controls="' + id + '-b">' +
         '<span class="ch-n">' + f.i + "</span>" +
         '<span class="ch-tit">' + esc(titulo) + "</span>" +
         '<span class="ch-ch">' + icoDoc("chevron") + "</span>" +
       "</button></h3>";

  /* Etiquetas de estado — leitura de um segundo */
  h += '<div class="ch-tags">';
  h += '<span class="tag t-sev">' + icoDoc("alert") + "Severidade " + esc(sev.lbl) + "</span>";
  if (txtCheio(c.r.cPrio)) h += '<span class="tag">' + icoDoc("flag") + "Prioridade " + esc(c.r.cPrio) + "</span>";
  if (c.item.critico) h += '<span class="tag t-crit">★ Fluxo crítico</span>';
  h += '<span class="tag t-st st-' + esc(c.r.status) + '">' + icoDoc(ICO_STATUS[c.r.status] || "minus") +
       esc(st.lbl) + "</span>";
  h += '<span class="tag">' + icoDoc("target") + esc(c.item.rot.c + " §" + c.item.cod) + "</span>";
  if (txtCheio(c.r.cNum)) h += '<span class="tag t-num">' + icoDoc("ticket") + esc(c.r.cNum) + "</span>";
  h += "</div>";

  /* Corpo recolhível */
  h += '<div class="ch-b" id="' + id + '-b"><div class="ch-b-in"><div class="ch-b-pad">';
  blocosChamado(c).forEach((bl) => {
    h += '<section class="campo' + (bl.tom ? " tom-" + bl.tom : "") + '">' +
         "<h4>" + icoDoc(bl.ic) + esc(bl.rot) + "</h4>" +
         "<p>" + escLinks(bl.txt) + "</p></section>";
  });

  const trilha = trilhaChamado(c, meta);
  if (trilha.length) {
    h += '<p class="trilha-t">' + icoDoc("route") + "Rastreabilidade</p><ol class=\"trilha\">";
    trilha.forEach((p) => {
      h += "<li><dl><dt>" + esc(p[0]) + "</dt><dd>" + esc(p[1]) + "</dd></dl></li>";
    });
    h += "</ol>";
  }

  h += '<div class="ch-acoes">' +
       '<button type="button" class="btn btn-sm" data-copiar="' + f.i + '">' + icoDoc("copy") +
       '<span class="rot">Copiar ficha</span></button>' +
       '<span class="ch-pos">Chamado ' + f.i + " de " + total + "</span></div>";

  h += "</div></div></div></article>";
  return h;
}

function exportarChamadosHTML() {
  const cham = chamados();
  if (!cham.length) {
    return toast("Nenhuma etapa marcada como “necessita chamado” ainda.", "warn");
  }
  const mod = App.modulo;
  const meta = moduloState(mod.id).meta;

  const porSev = {};
  cham.forEach((c) => { const k = c.r.cSev || "media"; porSev[k] = (porSev[k] || 0) + 1; });
  const criticos = cham.filter((c) => c.item.critico).length;

  /* Agrupamento por roteiro, na ordem do plano; dentro do grupo, do mais grave
     para o menos grave (chamados() já devolve ordenado por severidade). */
  const grupos = [];
  mod.roteiros.forEach((rot) => {
    const doRot = cham.filter((c) => c.item.rot === rot);
    if (doRot.length) grupos.push({ rot: rot, itens: doRot });
  });

  /* Numeração segue a ordem de leitura do documento. */
  const fichas = [];
  grupos.forEach((g) => g.itens.forEach((c) => fichas.push({ c: c, i: fichas.length + 1, rot: g.rot })));

  const CORES_SEV = { critica: "var(--sev-critica)", alta: "var(--sev-alta)",
                      media: "var(--sev-media)", baixa: "var(--sev-baixa)" };
  const EXPLICA_SEV = {
    critica: "Impeditivo de lançamento",
    alta: "Sem contorno razoável",
    media: "Existe caminho alternativo",
    baixa: "Incômodo pontual"
  };
  const ICO_SEV = { critica: "alert", alta: "flag", media: "clock", baixa: "info" };

  let b = "";

  /* ---------------------------------------------------------- Barra superior */
  b += '<a class="skip" href="#board">Ir direto para a lista de chamados</a>';
  b += '<header class="top">' +
       '<div class="top-id"><span class="logo" aria-hidden="true">' + icoDoc("ticket") + "</span>" +
       '<span class="top-txt"><span class="top-marca">Faktory Flow · Chamados</span>' +
       '<span class="top-tit">' + esc(mod.nome) + "</span></span></div>" +
       '<div class="top-acoes">' +
         '<button type="button" class="btn" id="tudo" data-act="tudo" aria-pressed="true">' +
           '<span data-exp hidden>' + icoDoc("expand") + "</span>" +
           "<span data-col>" + icoDoc("collapse") + "</span>" +
           '<span class="rot">Recolher tudo</span></button>' +
         '<button type="button" class="btn" data-act="copiar-todos">' + icoDoc("copy") +
           '<span class="rot">Copiar fichas</span></button>' +
         '<button type="button" class="btn" data-act="imprimir">' + icoDoc("print") +
           '<span class="rot">Imprimir · PDF</span></button>' +
         '<button type="button" class="btn btn-ico" id="tema" data-act="tema" aria-label="Alternar tema">' +
           "<span data-sol>" + icoDoc("sun") + "</span><span data-lua hidden>" + icoDoc("moon") + "</span></button>" +
         '<button type="button" class="btn btn-ico only-mobile" id="menu" data-act="menu" ' +
           'aria-expanded="false" aria-controls="side" aria-label="Abrir índice de chamados">' + icoDoc("list") + "</button>" +
       "</div></header>";

  b += '<div class="scrim" data-act="fechar-menu"></div>';
  b += '<div class="shell">';

  /* -------------------------------------------------------- Índice lateral */
  b += '<aside class="side" id="side" aria-label="Índice de chamados"><div class="side-in">';
  b += '<div class="busca">' +
       '<span class="busca-ico">' + icoDoc("search") + "</span>" +
       '<input type="search" id="q" class="busca-i" autocomplete="off" spellcheck="false" ' +
       'placeholder="Buscar título, texto ou item…" aria-label="Buscar nos chamados">' +
       '<button type="button" class="busca-x" id="buscaX" data-act="limpar-busca" aria-label="Limpar busca" hidden>' +
       icoDoc("x") + "</button></div>";

  b += '<div class="chips" role="group" aria-label="Filtrar por severidade">';
  CH_SEV_ORDEM.forEach((k) => {
    if (!porSev[k]) return;
    b += '<button type="button" class="chip chip-' + k + '" data-sev="' + k + '" aria-pressed="false">' +
         '<span class="dot" aria-hidden="true"></span>' + esc(SEVERIDADES[k].lbl) +
         "<b>" + porSev[k] + "</b></button>";
  });
  if (criticos) {
    b += '<button type="button" class="chip chip-crit" data-crit="1" aria-pressed="false">' +
         '<span class="star" aria-hidden="true">★</span>Fluxo crítico<b>' + criticos + "</b></button>";
  }
  b += "</div>";

  b += '<div class="side-res"><span id="cont" aria-live="polite">' + cham.length +
       (cham.length === 1 ? " chamado" : " chamados") + "</span>" +
       '<button type="button" class="link" id="limpar" data-act="limpar" hidden>Limpar filtros</button></div>';

  b += '<nav class="nav">';
  grupos.forEach((g) => {
    b += '<div class="nav-g"><p class="nav-gt">' + esc(g.rot.c + " · " + g.rot.n) + "</p><ul>";
    fichas.filter((f) => f.rot === g.rot).forEach((f) => {
      const k = f.c.r.cSev || "media";
      b += '<li><a class="nav-i" href="#ch' + f.i + '" data-alvo="ch' + f.i + '"' +
           ' style="animation-delay:' + (Math.min(f.i, 14) * 22) + 'ms">' +
           '<span class="nav-sev" style="background:' + CORES_SEV[k] + '" aria-hidden="true"></span>' +
           '<span class="nav-t">' + esc(tituloChamado(f.c)) + "</span>" +
           '<span class="nav-n">' + f.i + "</span></a></li>";
    });
    b += "</ul></div>";
  });
  b += "</nav></div></aside>";

  /* ------------------------------------------------------------- Conteúdo */
  b += '<main class="main"><div class="wrap">';

  /* Capa: identificação — só o que foi preenchido */
  b += '<section class="hero"><h1>Chamados a abrir · ' + esc(mod.nome) + "</h1>" +
       '<p class="hero-sub">' + cham.length + (cham.length === 1 ? " chamado registrado" : " chamados registrados") +
       " na validação" + (criticos ? " · " + criticos + " em fluxo crítico" : "") +
       " · documento gerado em " + esc(agoraBR()) + "</p>";

  const ident = [];
  if (txtCheio(meta.responsavel)) ident.push(["user", "Responsável", meta.responsavel]);
  if (meta.data) ident.push(["clock", "Data da validação", dataBR(meta.data)]);
  if (txtCheio(ambienteTexto(meta))) ident.push(["layers", "Ambiente testado", ambienteTexto(meta)]);
  if (txtCheio(meta.versao)) ident.push(["spark", "Versão testada", meta.versao]);
  if (txtCheio(mod.versaoDoc)) ident.push(["file", "Documento de origem", mod.versaoDoc]);
  if (ident.length) {
    b += '<dl class="ident">';
    ident.forEach((p) => {
      b += "<div>" + icoDoc(p[0]) + "<dt>" + esc(p[1]) + "</dt><dd>" + esc(p[2]) + "</dd></div>";
    });
    b += "</dl>";
  }
  b += "</section>";

  /* Severidades presentes — nenhuma linha zerada */
  b += '<section class="kpis" aria-label="Chamados por severidade">';
  CH_SEV_ORDEM.forEach((k) => {
    const n = porSev[k] || 0;
    if (!n) return;
    b += '<div class="kpi" style="--kc:' + CORES_SEV[k] + '">' +
         '<p class="kpi-l">' + icoDoc(ICO_SEV[k]) + esc(SEVERIDADES[k].lbl) + "</p>" +
         '<p class="kpi-v">' + n + "</p>" +
         '<p class="kpi-s">' + esc(EXPLICA_SEV[k]) + " · " + pct(n, cham.length) + "%</p></div>";
  });
  b += "</section>";

  const legenda = CH_SEV_ORDEM.filter((k) => porSev[k])
    .map((k) => porSev[k] + " " + SEVERIDADES[k].lbl.toLowerCase()).join(", ");
  b += '<div class="barra" role="img" aria-label="Distribuição por severidade: ' + escAttr(legenda) + '">';
  CH_SEV_ORDEM.forEach((k) => {
    const n = porSev[k] || 0;
    if (!n) return;
    b += '<span style="width:' + pct(n, cham.length) + "%;background:" + CORES_SEV[k] + '"></span>';
  });
  b += "</div>";

  /* Como usar — fechado por padrão, zero ruído para quem já sabe */
  b += '<details class="ajuda"><summary>' + icoDoc("info") +
       "Como usar este documento<span class=\"mais\">abrir</span></summary><ul>" +
       "<li>Cada ficha é <b>um chamado a abrir</b>: só entraram as etapas reprovadas ou bloqueadas que o validador marcou para chamado.</li>" +
       "<li><b>Copiar ficha</b> leva os campos em texto, na ordem em que se preenche o sistema de chamados.</li>" +
       "<li>Use a <b>busca</b> e os <b>filtros de severidade</b> no índice à esquerda; <b>Imprimir · PDF</b> respeita o que está filtrado.</li>" +
       "<li>Atalhos: <b>/</b> busca · <b>E</b> expande tudo · <b>R</b> recolhe tudo.</li>" +
       "<li>★ marca etapas de fluxo crítico — nesses casos o plano manda parar o teste e reportar imediatamente.</li>" +
       "</ul></details>";

  /* Fichas agrupadas por roteiro */
  b += '<div class="board" id="board">';
  grupos.forEach((g) => {
    b += '<section class="grupo"><header class="grupo-h">' + icoDoc("route") +
         "<h2>" + esc(g.rot.c + " · " + g.rot.n) + "</h2>" +
         '<span class="grupo-n">' + g.itens.length + "</span></header>";
    fichas.filter((f) => f.rot === g.rot).forEach((f) => {
      b += fichaChamadoHTML(f, cham.length, meta);
    });
    b += "</section>";
  });
  b += "</div>";

  b += '<p class="vazio" id="vazio" hidden>' + icoDoc("search") +
       "<strong>Nenhum chamado corresponde aos filtros</strong>" +
       '<button type="button" class="link" id="limparX" data-act="limpar">Limpar filtros e ver todos</button></p>';

  b += '<footer class="rodape">Documento de chamados do módulo ' + esc(mod.nome) +
       ", gerado automaticamente pela plataforma de validação Faktory Flow em " + esc(agoraBR()) +
       ". Contém apenas as etapas marcadas para abertura de chamado — não é o plano de validação completo.</footer>";

  b += "</div></main></div>";
  b += '<div class="aviso" id="aviso" role="status" aria-live="polite"></div>';

  /* Fichas em texto puro, para os botões de cópia. */
  const copias = {};
  fichas.forEach((f) => { copias[f.i] = textoFicha(f.c); });
  const json = JSON.stringify(copias)
    .replace(/</g, "\\u003C")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");

  const FIM = "<" + "/script>";
  const doc =
    '<!DOCTYPE html><html lang="pt-BR" data-theme="light"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<meta name="color-scheme" content="light dark">' +
    "<title>Chamados · " + esc(mod.nome) + " · Faktory Flow</title>" +
    "<style>" + docChamadosCSS() + "</style></head><body>" + b +
    "<script>var FICHAS=" + json + ";" + FIM +
    "<script>" + docChamadosJS() + FIM +
    "</body></html>";

  const nome = "chamados-" + slug(mod.nome) + "-" + hoje() + ".html";
  if (baixarArquivo(nome, doc, "text/html")) {
    toast(cham.length + " chamado(s) exportados em " + nome, "ok");
  }
}

/* ------------------------------------------------------------ 10. RENDER GERAL */

function renderTudo() {
  $("#view-dashboard").hidden = App.view !== "dashboard";
  $("#view-roteiro").hidden   = App.view !== "roteiro";
  $("#view-conclusao").hidden = App.view !== "conclusao";

  if (App.view === "dashboard") renderDashboard();
  else if (App.view === "roteiro") renderRoteiro();
  else renderConclusao();

  renderNav();
  document.title = "Validação " + App.modulo.nome + " · " + stats(todosItens()).pctConcluido + "% · Faktory Flow";
}

/** Atualiza apenas o card de um item, sem redesenhar a página inteira. */
function atualizarItem(id) {
  const el = $('[data-item="' + CSS.escape(id) + '"]');
  const it = todosItens().filter((i) => i.id === id)[0];
  if (!el || !it) return renderTudo();
  const novo = document.createElement("div");
  novo.innerHTML = itemHTML(it);
  el.replaceWith(novo.firstElementChild);
  renderNav();
  atualizarContadoresRoteiro();
}

/** Atualiza os KPIs e contadores da vista de roteiro sem recriar os cards. */
function atualizarContadoresRoteiro() {
  if (App.view !== "roteiro") return;
  const rot = App.modulo.roteiros.filter((r) => r.c === App.roteiro)[0];
  if (!rot) return;
  const s = stats(itensDoRoteiro(rot));
  const kpis = $$("#view-roteiro .kpi b");
  if (kpis.length >= 4) {
    kpis[0].textContent = s.pctConcluido + "%";
    kpis[1].textContent = s.aprovado;
    kpis[2].textContent = s.reprovado;
    kpis[3].textContent = s.chamados;
  }
  const subs = $$("#view-roteiro .kpi small");
  if (subs.length >= 4) {
    subs[0].textContent = s.executados + " de " + s.total + " etapas";
    subs[2].textContent = s.bloqueado + " bloqueada(s)";
  }
  /* Usa o índice real da seção (data-sec), pois filtros podem ocultar seções inteiras. */
  const itensRot = itensDoRoteiro(rot);
  $$("#view-roteiro .section-head").forEach((h) => {
    const sec = rot.s[Number(h.dataset.sec)]; if (!sec) return;
    const ss = stats(itensRot.filter((x) => x.sec === sec));
    const c = $(".sh-count", h); if (c) c.textContent = ss.executados + "/" + ss.total;
  });
}

/** Monta as opções do seletor de ambiente da barra lateral (uma única vez). */
function montarSelectAmbiente() {
  const sel = $("#mAmb");
  if (!sel || sel.dataset.pronto) return;
  sel.innerHTML = '<option value="">Selecione o ambiente…</option>' +
    AMBIENTES.map((a) => '<option value="' + escAttr(a.id) + '">' + esc(a.nome) + "</option>").join("");
  sel.dataset.pronto = "1";
}

function preencherMeta() {
  const meta = moduloState(App.modulo.id).meta;
  montarSelectAmbiente();
  $("#mResp").value = meta.responsavel || "";
  $("#mData").value = meta.data || hoje();
  $("#mAmb").value  = meta.ambienteTipo || "";
  $("#mUrl").value  = meta.ambienteUrl || "";
  $("#mVer").value  = meta.versao || "";
  sincronizarMeta();
}

/** Reflete o estado em todos os campos e rótulos, sem redesenhar a página.
 *  `origem` é o elemento sendo editado, que não deve ter o valor sobrescrito. */
function sincronizarMeta(origem) {
  const meta = moduloState(App.modulo.id).meta;
  const amb = ambientePorId(meta.ambienteTipo);

  /* Espelha o valor em todos os campos ligados ao mesmo dado */
  $$("[data-meta]").forEach((el) => {
    if (el === origem) return;
    const v = meta[el.dataset.meta];
    if (el.value !== (v || "")) el.value = v || "";
  });

  /* Campo de URL e nota só existem depois de escolher o ambiente */
  [["#mUrlWrap", "#mAmbNota"], ["#dUrlWrap", null]].forEach(([wrap, nota]) => {
    const w = $(wrap); if (w) w.hidden = !meta.ambienteTipo;
    if (!nota) return;
    const n = $(nota);
    if (!n) return;
    n.hidden = !amb;
    if (amb) {
      n.className = "amb-nota" + (amb.id === "producao" ? " is-alerta" : "");
      n.innerHTML = ico(amb.id === "producao" ? "alert" : "info") + "<span>" + esc(amb.nota) + "</span>";
    }
  });

  /* Rótulos do topo do painel */
  const tr = $("#tagResp");
  if (tr) tr.innerHTML = ico("user") + esc(meta.responsavel || "Responsável não informado");
  const td = $("#tagData");
  if (td) td.innerHTML = ico("clock") + esc(dataBR(meta.data));
  const ta = $("#tagAmb");
  if (ta) {
    ta.innerHTML = ico("layers") + esc(amb ? amb.nome : "Ambiente não informado");
    ta.classList.toggle("is-prod", meta.ambienteTipo === "producao");
  }
}

/** Ponto único de escrita da identificação. */
function setMeta(campo, valor, origem) {
  const meta = moduloState(App.modulo.id).meta;
  meta[campo] = valor;

  /* Ao escolher o ambiente, sugere a URL conhecida — o validador ajusta se precisar. */
  if (campo === "ambienteTipo") {
    const amb = ambientePorId(valor);
    if (amb && !meta.ambienteUrl) meta.ambienteUrl = amb.url;
    if (!valor) meta.ambienteUrl = "";
  }
  salvar(false);
  sincronizarMeta(origem);
}

function trocarModulo(id) {
  const mod = MODULOS.filter((m) => m.id === id)[0];
  if (!mod) return;
  App.modulo = mod;
  App.db.ui.modulo = id;
  App.view = "dashboard";
  App.roteiro = mod.roteiros[0].c;
  App.abertos = {};
  salvar(true);
  preencherMeta();
  renderTudo();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function irPara(view, rot) {
  App.view = view;
  if (rot) App.roteiro = rot;
  document.body.classList.remove("nav-open");
  renderTudo();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* -------------------------------------------------------------- 11. TEMA */

function aplicarTema(t) {
  const html = document.documentElement;
  const escuro = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  html.setAttribute("data-theme", escuro ? "dark" : "light");
  $(".ico-sun").hidden = escuro;
  $(".ico-moon").hidden = !escuro;
}

/* ------------------------------------------------------------ 12. EVENTOS */

/* salvar(false) já é debounced internamente (400ms) — não encadear outro atraso. */

function ligarEventos() {

  /* --- Navegação (sidebar + atalhos no conteúdo) --- */
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) {
      e.preventDefault();
      return irPara(go.dataset.go, go.dataset.rot);
    }
  });
  /* Enter / Espaço em qualquer alvo navegável (sidebar e barras do painel). */
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const b = e.target.closest ? e.target.closest("[data-go]") : null;
    if (!b || b.tagName === "BUTTON") return; /* botões já disparam click nativo */
    e.preventDefault(); irPara(b.dataset.go, b.dataset.rot);
  });

  /* --- Menu lateral (mobile) --- */
  $("#btnMenu").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  $("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));

  /* --- Seleção de módulo --- */
  $("#selModulo").addEventListener("change", (e) => trocarModulo(e.target.value));

  /* --- Busca e filtros --- */
  $("#navSearch").addEventListener("input", debounce((e) => {
    App.busca = e.target.value.trim();
    renderNav();
    if (App.view === "roteiro") renderRoteiro();
  }, 220));

  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    App.filtro = b.dataset.f;
    $$("#filters .filter-pill").forEach((p) => p.classList.toggle("is-on", p === b));
    if (App.view === "roteiro") renderRoteiro(); else irPara("roteiro", App.roteiro);
  });

  /* --- Identificação da validação ---
     Os mesmos campos existem na barra lateral e no painel do módulo. Escutar
     no documento cobre os dois, inclusive os que são recriados a cada render. */
  document.addEventListener("input", (e) => {
    const el = e.target.closest ? e.target.closest("[data-meta]") : null;
    if (!el) return;
    setMeta(el.dataset.meta, el.value, el);
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest ? e.target.closest("[data-meta]") : null;
    if (!el || el.tagName !== "SELECT") return;
    setMeta(el.dataset.meta, el.value, el);
    /* Trocar de ambiente muda a nota exibida no painel: vale redesenhar. */
    if (App.view === "dashboard") renderDashboard();
    if (App.view === "conclusao") renderConclusao();
  });

  /* --- Interações dentro do conteúdo principal --- */
  $("#main").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;

    if (act === "toggle") {
      App.abertos[id] = !App.abertos[id];
      return atualizarItem(id);
    }
    if (act === "status") {
      const r = reg(id, true);
      r.status = (r.status === b.dataset.v) ? "nao" : b.dataset.v;
      salvar(true); /* status é o dado mais importante: grava na hora */
      return atualizarItem(id);
    }
    if (act === "chamado") {
      const r = reg(id, true);
      const sim = b.dataset.v === "sim";
      r.chamado = sim ? 1 : 0;
      if (sim && !r.cTitulo) {
        const it = todosItens().filter((i) => i.id === id)[0];
        if (it) {
          r.cTitulo = "[" + App.modulo.sigla + " " + it.rot.c + " §" + it.cod + "] " + it.acao.slice(0, 90);
          if (!r.cDesc && (r.problema || r.obs)) r.cDesc = r.problema || r.obs;
          if (!r.cImpacto && it.critico) { r.cSev = "alta"; r.cPrio = "Alta"; }
        }
      }
      App.abertos[id] = true;
      salvar(true);
      return atualizarItem(id);
    }
    if (act === "expandir" || act === "recolher") {
      const rot = App.modulo.roteiros.filter((r) => r.c === App.roteiro)[0];
      itensDoRoteiro(rot).forEach((it) => { App.abertos[it.id] = (act === "expandir"); });
      return renderRoteiro();
    }
    if (act === "aprovar-pendentes") {
      const rot = App.modulo.roteiros.filter((r) => r.c === App.roteiro)[0];
      const pend = itensDoRoteiro(rot).filter((it) => { const r = reg(it.id); return r.status === "nao" || r.status === "andamento"; });
      if (!pend.length) return toast("Não há etapas pendentes neste roteiro.", "warn");
      return confirmar("Aprovar etapas pendentes",
        "Isso marcará " + pend.length + " etapa(s) do roteiro " + rot.c + " como Aprovado. Use apenas se você realmente executou todas elas.",
        "Aprovar " + pend.length, () => {
          pend.forEach((it) => { reg(it.id, true).status = "aprovado"; });
          salvar(true); renderRoteiro(); renderNav();
          toast(pend.length + " etapa(s) aprovadas.", "ok");
        });
    }
    if (act === "limpar-roteiro") {
      const rot = App.modulo.roteiros.filter((r) => r.c === App.roteiro)[0];
      return confirmar("Limpar roteiro " + rot.c,
        "Todos os status, observações e chamados registrados neste roteiro serão apagados. Esta ação não pode ser desfeita.",
        "Limpar roteiro", () => {
          const m = moduloState(App.modulo.id);
          itensDoRoteiro(rot).forEach((it) => { delete m.itens[it.id]; });
          salvar(true); renderRoteiro(); renderNav();
          toast("Roteiro " + rot.c + " limpo.", "ok");
        }, true);
    }
    if (act === "limpar-filtros") {
      App.filtro = "todos"; App.busca = ""; $("#navSearch").value = "";
      $$("#filters .filter-pill").forEach((p) => p.classList.toggle("is-on", p.dataset.f === "todos"));
      return renderTudo();
    }
    if (act === "print") return window.print();
    if (act === "html")  return exportarHTML();
    if (act === "json")  return exportarJSON();
    if (act === "xlsx")  return exportarXLSX();
    if (act === "chamados-xlsx") return exportarChamadosXLSX();
    if (act === "chamados-html") return exportarChamadosHTML();
  });

  /* --- Campos de texto e selects dos itens --- */
  $("#main").addEventListener("input", (e) => {
    const f = e.target.closest("[data-f]"); if (!f) return;
    const r = reg(f.dataset.id, true);
    r[f.dataset.f] = f.value;
    if (f.dataset.f === "cSev") f.dataset.sev = f.value;
    salvar(false);
    const card = f.closest(".item");
    if (card) {
      const tog = $(".item-toggle", card);
      if (tog) tog.classList.toggle("has-data", temConteudo(r));
    }
  });
  $("#main").addEventListener("change", (e) => {
    const f = e.target.closest("[data-f]"); if (!f) return;
    const r = reg(f.dataset.id, true);
    r[f.dataset.f] = f.value;
    if (f.dataset.f === "cSev") { f.dataset.sev = f.value; atualizarItem(f.dataset.id); }
    salvar(false);
  });

  /* --- Atalhos de teclado sobre um item --- */
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); salvar(true); toast("Avaliação salva.", "ok"); }
      return;
    }
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    const card = e.target.closest ? e.target.closest(".item") : null;
    if (!card) return;
    const id = card.dataset.item;
    const mapa = { a: "aprovado", r: "reprovado", b: "bloqueado", e: "andamento", n: "nao" };
    const k = e.key.toLowerCase();
    if (mapa[k]) {
      e.preventDefault();
      const rr = reg(id, true);
      rr.status = mapa[k] === "nao" ? "nao" : (rr.status === mapa[k] ? "nao" : mapa[k]);
      salvar(false); atualizarItem(id);
      const novo = $('[data-item="' + CSS.escape(id) + '"]');
      if (novo) { const t = $(".item-toggle", novo); if (t) t.focus(); }
    } else if (k === "o" || e.key === "Enter") {
      e.preventDefault(); App.abertos[id] = !App.abertos[id]; atualizarItem(id);
    }
  });

  /* --- Topbar: salvar, tema, exportações --- */
  $("#btnSave").addEventListener("click", () => { salvar(true); toast("Avaliação salva no navegador.", "ok"); });

  $("#btnTheme").addEventListener("click", () => {
    const atual = document.documentElement.getAttribute("data-theme");
    App.db.ui.tema = atual === "dark" ? "light" : "dark";
    aplicarTema(App.db.ui.tema); salvar(true);
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if ((App.db.ui.tema || "auto") === "auto") aplicarTema("auto");
  });

  const menu = $("#exportMenu"), btnExp = $("#btnExport");
  btnExp.addEventListener("click", (e) => {
    e.stopPropagation();
    const aberto = !menu.hidden;
    menu.hidden = aberto;
    btnExp.setAttribute("aria-expanded", String(!aberto));
  });
  document.addEventListener("click", (e) => {
    if (!menu.hidden && !e.target.closest(".dropdown")) { menu.hidden = true; btnExp.setAttribute("aria-expanded", "false"); }
  });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    menu.hidden = true; btnExp.setAttribute("aria-expanded", "false");
    switch (b.dataset.act) {
      case "pdf":  irPara("conclusao"); setTimeout(() => window.print(), 400); break;
      case "html": exportarHTML(); break;
      case "json": exportarJSON(); break;
      case "xlsx": exportarXLSX(); break;
      case "chamados-xlsx": exportarChamadosXLSX(); break;
      case "chamados-html": exportarChamadosHTML(); break;
      case "import": $("#fileImport").click(); break;
      case "reset":
        confirmar("Limpar avaliação do módulo " + App.modulo.nome,
          "Todos os status, observações, evidências e chamados registrados neste módulo serão apagados definitivamente. " +
          "Exporte o JSON antes se quiser guardar uma cópia.",
          "Apagar tudo", () => {
            delete App.db.modulos[App.modulo.id];
            moduloState(App.modulo.id);
            App.abertos = {};
            salvar(true); preencherMeta(); renderTudo();
            toast("Avaliação limpa.", "ok");
          }, true);
        break;
    }
  });

  $("#fileImport").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importarJSON(String(rd.result));
    rd.onerror = () => toast("Não foi possível ler o arquivo.", "err");
    rd.readAsText(f, "utf-8");
    e.target.value = "";
  });

  /* --- Aviso ao fechar com gravação pendente --- */
  window.addEventListener("beforeunload", () => { salvar(true); });
}

/* ------------------------------------------------------------ 13. INÍCIO */

function iniciar() {
  carregar();
  aplicarTema(App.db.ui.tema || "auto");

  App.modulo = MODULOS.filter((m) => m.id === App.db.ui.modulo)[0] || MODULOS[0];
  App.roteiro = App.modulo.roteiros[0].c;
  moduloState(App.modulo.id);

  $("#selModulo").innerHTML = MODULOS.map((m) =>
    '<option value="' + escAttr(m.id) + '"' + (m.id === App.modulo.id ? " selected" : "") + ">" +
    esc(m.nome) + "</option>").join("");

  preencherMeta();
  ligarEventos();
  renderTudo();

  /* O filtro de achados só faz sentido em módulos cujo documento já traz
     comentários de validação registrados. */
  const pill = $("#pillAchado");
  if (pill) pill.hidden = stats(todosItens()).achados === 0;

  const s = stats(todosItens());
  if (s.executados > 0) {
    setTimeout(() => toast("Avaliação recuperada: " + s.executados + " de " + s.total + " etapas já registradas.", "ok"), 500);
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
else iniciar();

})();
</script>
