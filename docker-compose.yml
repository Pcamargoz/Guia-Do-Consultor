# Ambiente LOCAL que imita o Vercel + Neon (produção roda no Vercel).
#
#   docker compose -p faktory-manual up -d            → http://127.0.0.1:8081 (login; porta só no loopback do host)
#   docker compose -p faktory-manual --profile pdf run --rm gerar-pdf
#                                                     → regenera public/downloads/Apostila-do-Consultor-Faktory-Flow.pdf
#
# Credenciais e segredos locais vêm do arquivo .env (veja .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: faktory-manual-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: faktory
      POSTGRES_PASSWORD: faktory
      POSTGRES_DB: faktory
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktory -d faktory"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: node:22-alpine
    container_name: faktory-manual-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    working_dir: /app
    # Porta publicada no host para acesso local e pela rede.
    # HOST=0.0.0.0: o processo no container precisa escutar em todas as interfaces
    # para o publish do Docker alcançar o app (dev-server default é 127.0.0.1).
    ports: ["8081:3000"]
    environment:
      DATABASE_URL: postgres://faktory:faktory@db:5432/faktory
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      PORT: "3000"
      HOST: "0.0.0.0"
    command: ["sh", "-c", "npm ci --no-audit --no-fund && node scripts/migrar.mjs && node scripts/dev-server.mjs"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  # ---------- Geração do PDF da apostila (sob demanda, perfil "pdf") ----------
  # Serve public/ sem login, apenas na rede interna do Docker, para o Chromium do Gotenberg.
  pdf-origem:
    image: nginx:alpine
    profiles: ["pdf"]
    volumes:
      - ./public:/usr/share/nginx/html:ro

  pdf-engine:
    image: gotenberg/gotenberg:8
    profiles: ["pdf"]
    command: ["gotenberg", "--api-timeout=180s"]

  gerar-pdf:
    image: node:22-alpine
    profiles: ["pdf"]
    depends_on: [pdf-engine, pdf-origem]
    working_dir: /work
    environment:
      APOSTILA_URL: http://pdf-origem/apostila.html?pdf=1
      PDF_DESTINO: /work/public/downloads/Apostila-do-Consultor-Faktory-Flow.pdf
    command: ["node", "scripts/gerar-pdf-apostila.mjs"]
    volumes:
      - ./scripts:/work/scripts:ro
      - ./public/downloads:/work/public/downloads

volumes:
  banco:
    name: faktory-manual-banco
  node_modules:
    name: faktory-manual-node-modules
